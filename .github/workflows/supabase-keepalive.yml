name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 3 */2 * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase database
        run: |
          curl -f \
            "${{ secrets.SUPABASE_URL }}/rest/v1/Project?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
